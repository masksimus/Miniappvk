<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Анкета курьера X5</title>
<style>
body{margin:0;font-family:-apple-system,Roboto,Arial,sans-serif;background:#f5f7fa;color:#11181f;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.box{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(17,24,31,.08)}
h1{margin:0 0 8px;font-size:22px}
p{color:#6d7885;margin:0 0 20px;font-size:15px;line-height:1.45}
.btn{display:block;background:#e30613;color:#fff;text-decoration:none;padding:14px;border-radius:14px;font-weight:700;font-size:16px;margin-bottom:10px}
.btn.alt{background:#fdecee;color:#b8050f}
.spinner{width:40px;height:40px;border:3px solid #fdecee;border-top-color:#e30613;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<div class="spinner"></div>
<h1>Открываем анкету X5</h1>
<p>Если страница не открылась автоматически — нажмите кнопку ниже:</p>
<a class="btn" href="https://tracking.lovko.pro/click?pid=4797&offer_id=40" target="_blank" rel="noopener noreferrer">Перейти к анкете</a>
<a class="btn alt" id="copyBtn" href="#">Скопировать ссылку</a>
</div>
<script>
var URL_="https://tracking.lovko.pro/click?pid=4797&offer_id=40";
setTimeout(function(){try{window.location.replace(URL_);}catch(e){}},800);
document.getElementById("copyBtn").onclick=function(e){
e.preventDefault();
navigator.clipboard.writeText(URL_).then(function(){
e.target.textContent="✅ Скопировано";
setTimeout(function(){e.target.textContent="Скопировать ссылку";},2000);
});
};
</script>
</body>
</html>
